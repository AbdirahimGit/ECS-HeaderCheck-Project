<!DOCTYPE html>
<!--
  The page structure. Styles are in static/app.css and behaviour in
  static/app.js, so the Content-Security-Policy can block inline code.
  No frameworks and no build step. FastAPI serves this at "/".
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeaderCheck</title>

  <!-- Styles live in their own file so the Content-Security-Policy can block inline CSS -->
  <link rel="stylesheet" href="/static/app.css">
</head>

<body>
  <main>
    <h1>HeaderCheck</h1>
    <p class="subtitle">Paste a website and see how well its security headers protect visitors.</p>

    <form id="form">
      <input id="url" type="text" placeholder="example.com" aria-label="Website address" autocomplete="off">
      <button id="go" type="submit">Check site</button>
    </form>

    <!-- Hidden until there is something to show -->
    <p id="error" class="error hidden" role="alert"></p>

    <section id="report" class="hidden">
      <div class="stats">
        <div class="stat"><div class="label">Grade</div><div class="value" id="grade"></div></div>
        <div class="stat"><div class="label">Headers present</div><div class="value" id="score"></div></div>
        <div class="stat"><div class="label">Certificate expires</div><div class="value" id="cert"></div></div>
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <!-- Script lives in its own file so the Content-Security-Policy can block inline JS -->
  <script src="/static/app.js"></script>
</body>
</html>
